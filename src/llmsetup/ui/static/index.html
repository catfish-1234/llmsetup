<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmsetup</title>
<style>
/* Self-contained by design: no fonts, scripts or styles are fetched. A tool for
   running models locally must work with the network off. */
:root {
  color-scheme: light;
  --surface-0:#f4f4f2; --surface-1:#fcfcfb; --surface-2:#eeeeec;
  --border:#dcdcd8; --border-strong:#c4c4be;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7975;
  /* Categorical slots 1-3, validated for the adjacent pairlist in both modes. */
  --series-weights:#2a78d6; --series-kv:#eb6834; --series-overhead:#1baf7a;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --accent:#2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0:#141413; --surface-1:#1a1a19; --surface-2:#232322;
    --border:#33332f; --border-strong:#45453f;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --series-weights:#3987e5; --series-kv:#d95926; --series-overhead:#199e70;
    --accent:#3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0:#141413; --surface-1:#1a1a19; --surface-2:#232322;
  --border:#33332f; --border-strong:#45453f;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
  --series-weights:#3987e5; --series-kv:#d95926; --series-overhead:#199e70;
  --accent:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 72px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 4px;letter-spacing:-.005em}
p{margin:0}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--surface-2);
  color:var(--text-secondary);border:1px solid var(--border)}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;margin-top:14px}
.card > h2 + p{margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:9px 11px}
.stat .k{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:15px;margin-top:2px}

fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-size:13px;font-weight:600;padding:0;margin-bottom:2px}
.why{font-size:12px;color:var(--text-muted);margin-bottom:8px;max-width:64ch}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--border-strong);background:var(--surface-1);
  color:var(--text-primary);border-radius:20px;padding:6px 13px;font-size:13px;
  cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:6px 9px;border-radius:7px;border:1px solid var(--border-strong);
  background:var(--surface-1);color:var(--text-primary);min-width:190px}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}

button.go{background:var(--accent);color:#fff;border:0;border-radius:8px;
  padding:10px 20px;font:inherit;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.55;cursor:default}

/* ---- memory meter: 3-segment stacked capacity bar --------------------- */
.meter{margin:10px 0 8px}
.track{display:flex;height:26px;border-radius:5px;background:var(--surface-2);
  overflow:hidden;position:relative}
/* 2px surface-coloured gap between touching segments. The separator is the
   gap, never a stroke. Rounded data-end on the last filled segment only. */
.seg{position:relative;border-right:2px solid var(--surface-1);min-width:2px}
.seg:last-of-type{border-right:0}
.seg.w{background:var(--series-weights)}
.seg.k{background:var(--series-kv)}
.seg.o{background:var(--series-overhead)}
.seg:first-child{border-radius:5px 0 0 5px}
.free{flex:1;background:transparent}
.capline{position:absolute;inset:0;pointer-events:none;
  border:1px solid var(--border);border-radius:5px}
/* Legend doubles as direct labelling, required relief for the light-mode
   contrast warning on the aqua slot, and identity is never colour-alone. */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

.cand{border:1px solid var(--border);border-radius:10px;padding:14px 16px;
  margin-top:10px;background:var(--surface-1)}
.cand.top{border-color:var(--accent);border-width:2px;padding:13px 15px}
.cand header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-size:15px;font-weight:600}
.status{font-size:12px;display:inline-flex;align-items:center;gap:5px}
.status .dot{width:8px;height:8px;border-radius:50%;flex:none}
.warn{font-size:12px;color:var(--text-secondary);margin-top:6px;padding-left:16px;
  position:relative}
.warn::before{content:"!";position:absolute;left:0;color:var(--warning);font-weight:700}
.cmd{display:flex;gap:8px;align-items:center;margin-top:10px;background:var(--surface-2);
  border-radius:7px;padding:8px 10px;font-size:12.5px;overflow-x:auto}
.cmd code{white-space:nowrap}
.copy{margin-left:auto;border:1px solid var(--border-strong);background:var(--surface-1);
  color:var(--text-primary);border-radius:6px;padding:4px 10px;font-size:12px;
  cursor:pointer;flex:none}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:10px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border)}
th{color:var(--text-muted);font-weight:500;font-size:11px;text-transform:uppercase;
  letter-spacing:.04em}
td.num{text-align:right;font-variant-numeric:tabular-nums}
details{margin-top:10px}
summary{cursor:pointer;font-size:12.5px;color:var(--text-secondary)}
.err{border-left:3px solid var(--critical);padding-left:12px}
.spin{color:var(--text-muted);font-size:13px}
@media (max-width:560px){.row{gap:14px}select{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>llmsetup</h1>
    <span class="tag" id="catalog-tag">loading catalog…</span>
    <span class="tag" id="runtime-tag"></span>
  </header>
  <p class="muted" style="font-size:13px">
    Pick, size and tune a local open-weight model for this machine.
  </p>

  <section class="card" aria-labelledby="hw-h">
    <h2 id="hw-h">This machine</h2>
    <p class="sec" id="hw-summary">detecting…</p>
    <div class="grid" id="hw-stats" style="margin-top:12px"></div>
    <div id="hw-warnings"></div>
  </section>

  <section class="card" aria-labelledby="q-h">
    <h2 id="q-h">What do you need it for?</h2>
    <p class="sec">Your answers filter which models are eligible and decide which
      capabilities get tested during setup.</p>
    <form id="form" style="margin-top:14px"></form>
    <button class="go" id="go" type="button">Show me what fits</button>
  </section>

  <section id="results" aria-live="polite"></section>
</div>

<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t);
  if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const gb = n => (n == null ? "n/a" : n.toFixed(1) + " GB");

let HW = null, ANSWERS = {
  tasks: ["chat"], context_tokens: 8192, priority: "balanced",
  concurrent_users: 1, commercial_use: false,
};

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  } : undefined);
  if (!res.ok) throw new Error("request failed: " + res.status);
  return res.json();
}

/* ---------------------------------------------------------------- hardware */
async function loadHardware() {
  HW = await api("/api/hardware");
  $("#hw-summary").textContent = HW.summary;
  const stats = $("#hw-stats");
  stats.innerHTML = "";
  const rows = [
    ["Usable for a model", HW.memory_budget_gb + " GB"],
    ["Memory bandwidth", HW.bandwidth],
    ["Accelerator", HW.gpus.length ? HW.gpus[0].name : "CPU only"],
    ["Free disk", gb(HW.disk_free_bytes / 1073741824)],
  ];
  for (const [k, v] of rows) {
    const s = el("div", "stat");
    s.append(el("div", "k", k), el("div", "v", v));
    stats.append(s);
  }
  const warn = $("#hw-warnings");
  warn.innerHTML = "";
  for (const w of HW.detection_warnings || []) warn.append(el("p", "warn", w));
}

async function loadMeta() {
  try {
    const cat = await api("/api/catalog");
    $("#catalog-tag").textContent = cat.count + " models · " + cat.updated;
    const rt = await api("/api/runtimes");
    const ready = rt.runtimes.filter(r => r.available).map(r => r.label);
    $("#runtime-tag").textContent = ready.length
      ? ready.join(", ") + " installed" : "no inference engine installed";
  } catch (e) { $("#catalog-tag").textContent = "catalog unavailable"; }
}

/* ------------------------------------------------------------------ form */
const TASKS = [
  ["chat", "General chat"], ["coding", "Code"], ["agent", "Agents & tools"],
  ["rag", "My documents"], ["summarize", "Summarising"], ["creative", "Creative writing"],
  ["extract", "Structured data"], ["translate", "Translation"], ["vision", "Images"],
];
const CONTEXTS = [[4096,"4K, short chats"],[8192,"8K, normal"],
  [32768,"32K, long documents"],[65536,"64K, large sets"],[131072,"128K, everything"]];
const PRIORITIES = [["speed","Speed"],["balanced","Balanced"],["quality","Quality"]];
const EXTRAS = [["needs_tools","Tool calling"],["needs_vision","Image input"],
  ["needs_json","Strict JSON"],["needs_embeddings","Embeddings / search"],
  ["commercial_use","Commercial use"]];

function buildForm() {
  const f = $("#form");
  f.append(field("What will you use it for?",
    "This decides more than your hardware does. It filters eligible models and " +
    "selects the tests that must pass.",
    chips(TASKS, v => ANSWERS.tasks.includes(v), v => {
      const i = ANSWERS.tasks.indexOf(v);
      if (i >= 0) { if (ANSWERS.tasks.length > 1) ANSWERS.tasks.splice(i, 1); }
      else ANSWERS.tasks.push(v);
      return ANSWERS.tasks.includes(v);
    })));

  const row = el("div", "row");
  row.append(
    selectField("How much context?",
      "The KV cache grows linearly with this and can outgrow the weights themselves.",
      CONTEXTS, ANSWERS.context_tokens, v => ANSWERS.context_tokens = +v),
    selectField("Speed or quality?",
      "Shifts the ranking weights, and genuinely changes the answer.",
      PRIORITIES, ANSWERS.priority, v => ANSWERS.priority = v),
    selectField("Concurrent users?",
      "Each one needs its own KV cache slot, so this multiplies memory.",
      [[1,"Just me"],[2,"2"],[4,"4"],[8,"8"]], 1, v => ANSWERS.concurrent_users = +v));
  f.append(row);

  f.append(field("Anything required?",
    "A requirement you state here is one that gets tested against the running model.",
    chips(EXTRAS, k => !!ANSWERS[k], k => (ANSWERS[k] = !ANSWERS[k]))));
}

function field(label, why, node) {
  const fs = el("fieldset");
  fs.append(el("legend", null, label), el("div", "why", why), node);
  return fs;
}
function chips(items, isOn, toggle) {
  const box = el("div", "chips");
  for (const [v, label] of items) {
    const b = el("button", "chip", label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(!!isOn(v)));
    b.onclick = () => b.setAttribute("aria-pressed", String(!!toggle(v)));
    box.append(b);
  }
  return box;
}
function selectField(label, why, options, initial, onChange) {
  const fs = el("fieldset");
  const sel = el("select");
  for (const [v, t] of options) {
    const o = el("option", null, t); o.value = v;
    if (String(v) === String(initial)) o.selected = true;
    sel.append(o);
  }
  sel.onchange = () => onChange(sel.value);
  sel.setAttribute("aria-label", label);
  fs.append(el("legend", null, label), el("div", "why", why), sel);
  return fs;
}

/* --------------------------------------------------------------- results */
$("#go").onclick = async () => {
  const out = $("#results");
  $("#go").disabled = true;
  out.innerHTML = "";
  const card = el("section", "card");
  card.append(el("p", "spin", "Working out what fits…"));
  out.append(card);
  try {
    render(await api("/api/plan", ANSWERS));
  } catch (e) {
    out.innerHTML = "";
    const c = el("section", "card err");
    c.append(el("h2", null, "Could not build a plan"), el("p", "sec", String(e)));
    out.append(c);
  } finally { $("#go").disabled = false; }
};

function render(plan) {
  const out = $("#results");
  out.innerHTML = "";

  if (plan.error) {
    const c = el("section", "card err");
    c.append(el("h2", null, "Nothing fits those requirements"),
             el("p", "sec", plan.error));
    if (plan.hint) c.append(el("p", "muted", plan.hint));
    out.append(c);
    return;
  }

  const card = el("section", "card");
  card.append(el("h2", null, "What fits"),
              el("p", "sec", "Runtime: " + plan.runtime + ". " + plan.runtime_reason));
  for (const n of plan.notes || []) card.append(el("p", "muted", n));
  if (plan.embedding_model) {
    card.append(el("p", "muted",
      "Retrieval also needs an embedding model: " + plan.embedding_model.name +
      " will be set up alongside it."));
  }
  plan.candidates.forEach((c, i) => card.append(candidate(c, i === 0)));
  out.append(card);
}

function candidate(c, isTop) {
  const box = el("div", "cand" + (isTop ? " top" : ""));
  const head = el("header");
  const left = el("div");
  const size = c.is_moe
    ? c.params_b + "B total / " + c.active_params_b + "B active"
    : c.params_b + "B";
  left.append(el("div", "name", c.name + " · " + c.quant));
  left.append(el("div", "muted", size + " · " + c.license +
    (c.tokens_per_second ? " · ~" + Math.round(c.tokens_per_second) + " tok/s" : "")));
  head.append(left, fitStatus(c));
  box.append(head);
  if (isTop) box.append(el("p", "sec", c.why));
  box.append(meter(c.memory));
  for (const w of c.warnings || []) box.append(el("div", "warn", w));

  const cmd = el("div", "cmd");
  const code = el("code", "mono", c.command);
  const copy = el("button", "copy", "Copy");
  copy.type = "button";
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(c.command); copy.textContent = "Copied"; }
    catch (e) { copy.textContent = "Select and copy"; }
    setTimeout(() => (copy.textContent = "Copy"), 1600);
  };
  cmd.append(code, copy);
  box.append(cmd);
  return box;
}

/* Status is never colour alone: a dot plus a written label.
   "Spills to CPU" only means something when there is a GPU to spill from. On a
   CPU-only machine every model runs on the CPU by definition, and labelling
   that a failure would flag every option as broken. */
function fitStatus(c) {
  const used = HW.memory_budget_gb ? c.memory.total_gb / HW.memory_budget_gb : 1;
  const hasGpu = HW.gpus && HW.gpus.length > 0;
  let colour = "var(--good)", text = "fits comfortably";
  if (hasGpu && !c.fits_on_gpu) {
    colour = "var(--critical)"; text = "spills to CPU";
  } else if (used > 1) {
    colour = "var(--critical)"; text = "does not fit";
  } else if (used > 0.9) {
    colour = "var(--warning)"; text = "fits, but at the edge";
  } else if (!hasGpu) {
    text = "fits in RAM";
  }
  const s = el("span", "status", null);
  const dot = el("span", "dot"); dot.style.background = colour;
  s.append(dot, el("span", null, text));
  return s;
}

/* Three-segment stacked capacity meter against the machine's usable memory.
   Segments are categorical (three different things), separated by a 2px surface
   gap. Every value is direct-labelled in the legend and repeated in the table,
   so nothing depends on colour or on hovering. */
function meter(m) {
  const budget = HW.memory_budget_gb || m.total_gb;
  const pct = v => Math.max(0, Math.min(100, (v / budget) * 100));
  const wrap = el("div", "meter");

  const track = el("div", "track");
  track.setAttribute("role", "img");
  track.setAttribute("aria-label",
    `Uses ${m.total_gb} of ${budget} GB: weights ${m.weights_gb}, ` +
    `KV cache ${m.kv_gb}, overhead ${m.overhead_gb}`);
  const parts = [["w", "Weights", m.weights_gb], ["k", "KV cache", m.kv_gb],
                 ["o", "Overhead", m.overhead_gb]];
  for (const [cls, label, value] of parts) {
    const seg = el("div", "seg " + cls);
    seg.style.width = pct(value) + "%";
    seg.title = label + ": " + gb(value);
    track.append(seg);
  }
  track.append(el("div", "free"));
  track.append(el("div", "capline"));
  wrap.append(track);

  const legend = el("div", "legend");
  const swatches = {w: "--series-weights", k: "--series-kv", o: "--series-overhead"};
  for (const [cls, label, value] of parts) {
    const item = el("span");
    const sw = el("span", "sw");
    sw.style.background = "var(" + swatches[cls] + ")";
    item.append(sw, el("span", null, label + " " + gb(value)));
    legend.append(item);
  }
  const total = el("span");
  total.append(el("span", null, "= " + gb(m.total_gb) + " of " + gb(budget) + " usable"));
  total.style.color = "var(--text-primary)";
  legend.append(total);
  wrap.append(legend);

  if (m.kv_quant && m.kv_quant !== "f16") {
    wrap.append(el("div", "warn", "KV cache quantized to " + m.kv_quant + " to fit"));
  }

  const det = el("details");
  det.append(el("summary", null, "Show the numbers"));
  const t = el("table");
  t.innerHTML =
    "<tr><th>Component</th><th style='text-align:right'>Size</th>" +
    "<th style='text-align:right'>Share of usable</th></tr>" +
    parts.map(([, label, v]) =>
      `<tr><td>${label}</td><td class="num">${gb(v)}</td>` +
      `<td class="num">${pct(v).toFixed(0)}%</td></tr>`).join("") +
    `<tr><td><strong>Total</strong></td><td class="num"><strong>${gb(m.total_gb)}</strong></td>` +
    `<td class="num"><strong>${pct(m.total_gb).toFixed(0)}%</strong></td></tr>`;
  det.append(t);
  wrap.append(det);
  return wrap;
}

buildForm();
loadHardware().catch(e => ($("#hw-summary").textContent = "detection failed: " + e));
loadMeta();
</script>
</body>
</html>
