# llmfit model catalog
#
# This file is DATA, not code. The open-weight landscape turns over every few
# weeks, so the catalog is versioned, dated, and designed to be edited or
# replaced without touching the planner.
#
#   - add your own entries here, or
#   - drop a YAML file in $LLMFIT_HOME/catalog.d/ (merged, later wins), or
#   - run `llmfit catalog refresh` to pull updated entries.
#
# Architecture fields (layers/hidden_size/kv_heads/head_dim) feed the KV-cache
# memory model. `arch_source: measured` means taken from the published config;
# `estimated` means inferred from the family and flagged in the plan. Whenever a
# real GGUF is on disk, llmfit reads the true values out of the file header and
# overrides whatever is written here.

schema_version: 1
updated: "2026-08-29"

quant_bpw:            # effective bits per weight, including embedding overhead
  Q2_K:    3.35
  Q3_K_S:  3.50
  Q3_K_M:  3.91
  Q3_K_L:  4.27
  IQ4_XS:  4.25
  Q4_0:    4.55
  Q4_K_S:  4.58
  Q4_K_M:  4.85
  Q5_K_S:  5.52
  Q5_K_M:  5.68
  Q6_K:    6.56
  Q8_0:    8.50
  MXFP4:   4.25          # gpt-oss native format
  FP8:     8.50
  BF16:   16.00
  F16:    16.00

models:

  # ------------------------------------------------------------------ Qwen 3.x
  - id: qwen3.8-27b
    tokenizer_family: qwen3.8
    name: Qwen3.8 27B
    publisher: Qwen
    params_b: 27
    layers: 62
    hidden_size: 5120
    # Back-derived from the measured ~16.4 GB KV cache at 262K rather than read
    # from a config, so it is a figure that reproduces the right total rather
    # than a description of the architecture. If this model turns out to be
    # hybrid or windowed, the real head count is higher and fewer layers cache.
    # Either way the file settles it on download.
    kv_heads: 2
    head_dim: 128
    max_context: 262144
    license: Apache-2.0
    commercial_ok: true
    quality_tier: 5
    tasks: [chat, coding, agent, rag, summarize, vision, extract, translate]
    supports_tools: true
    supports_vision: true
    supports_json: true
    languages: [en, zh, es, fr, de, ja, ko, ru, pt, ar, hi]
    gguf_repo: unsloth/Qwen3.8-27B-GGUF
    hf_repo: Qwen/Qwen3.8-27B
    ollama_name: qwen3.8:27b
    recommended_quants: [Q4_K_M, Q5_K_M, Q6_K, Q8_0]
    arch_source: estimated
    notes: >
      Dense vision-language model, 262K native context. Strong general default
      for a 24 GB card at Q4_K_M. Architecture figures estimated from the
      family; corrected from GGUF metadata once downloaded.

  - id: qwen3.6-35b-a3b
    tokenizer_family: qwen3.6
    name: Qwen3.6 35B-A3B
    publisher: Qwen
    params_b: 35
    active_params_b: 3
    layers: 48
    hidden_size: 2560
    kv_heads: 4
    head_dim: 128
    max_context: 262144
    license: Apache-2.0
    commercial_ok: true
    quality_tier: 5
    tasks: [chat, coding, agent, rag, summarize, extract]
    supports_tools: true
    supports_json: true
    is_reasoning: true
    languages: [en, zh, es, fr, de, ja, ko, ru]
    gguf_repo: unsloth/Qwen3.6-35B-A3B-GGUF
    hf_repo: Qwen/Qwen3.6-35B-A3B
    ollama_name: qwen3.6:35b-a3b
    recommended_quants: [Q4_K_M, Q5_K_M, Q6_K]
    full_attention_interval: 4
    arch_source: estimated
    notes: >
      MoE: needs memory for all 35B but only computes 3B per token, so it is far
      faster than a dense 35B. Excellent speed/quality point when it fits.
      Also hybrid: three Gated DeltaNet layers to every full-attention layer, so
      only a quarter of the layers keep a KV cache and long context costs about
      a quarter of what the layer count suggests. The interval is what the
      architecture write-ups agree on; the layer and head figures here are still
      estimates and get replaced by the file's own values on download.

